aid: scalekit
url: https://raw.githubusercontent.com/api-evangelist/scalekit/refs/heads/main/apis.yml
name: Scalekit
kind: company
description: Scalekit is the authentication platform for B2B SaaS and AI agents.
  It provides drop-in enterprise Single Sign-On (SAML/OIDC), SCIM directory
  provisioning, social login, full-stack user management, machine-to-machine
  (M2M) auth, and agent / MCP authentication with connected accounts and tool
  execution - all exposed through a per-environment REST API secured with OAuth
  2.0 client credentials.
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/scalekit.png
tags:
